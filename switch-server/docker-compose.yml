services:
  rr-netd:
    build:
      context: ../road-rash-arkits
      dockerfile: server/Dockerfile
      args:
        RR_NETD_REVISION: ${RR_NETD_REVISION:-switch-nx}
    container_name: roadrash-nx-netd
    restart: unless-stopped
    environment:
      RR_NETD_BIND: "0.0.0.0"
      RR_NETD_PORT: "8080"
      RR_NETD_HTTP_PORT: "8081"
      RR_NETD_LOG_DIR: "/data/race-logs"
      RR_NETD_SWITCH_ONLY: "${RR_NETD_SWITCH_ONLY:-1}"
      RR_NETD_MIN_HUMANS: "${RR_NETD_MIN_HUMANS:-2}"
      RR_NETD_MAX_ROOMS: "${RR_NETD_MAX_ROOMS:-500}"
      RR_NETD_ADMIN_TOKEN: "${RR_NETD_ADMIN_TOKEN:-changeme-switch-admin}"
      RR_NETD_RTC: "0"
    volumes:
      - ./data/race-logs:/data/race-logs
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf \"GET /net/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"ok.:true\" <&3'"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: roadrash-nx-proxy
    restart: unless-stopped
    depends_on:
      - rr-netd
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
